<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teddy Wags — click a side, his booty swings that way</title>
<meta name="description" content="Teddy the cockapoo swings his booty and wags his tail on whichever side you click. Kate's idea.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:"Baloo 2", ui-rounded, "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
    background:linear-gradient(180deg,#fff6e2 0%,#ffecca 55%,#ffe3ae 100%);
    color:#4a3826;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; overflow-x:hidden;
    user-select:none; -webkit-user-select:none;
  }
  header{ text-align:center; padding:26px 16px 4px; }
  h1{ font-size:clamp(2rem,6vw,3.2rem); font-weight:800; letter-spacing:.5px; color:#5b4028; }
  h1 .paw{ display:inline-block; transform:rotate(-12deg); }
  .sub{ font-size:clamp(1rem,3vw,1.25rem); font-weight:600; color:#8a6a45; margin-top:2px; }
  #status{
    margin-top:14px; min-height:2.2em; font-size:clamp(1.15rem,3.6vw,1.6rem);
    font-weight:800; color:#b45a1b; text-align:center; padding:0 12px;
  }
  #stage{
    position:relative; width:min(92vw,560px); aspect-ratio:640/600;
    cursor:pointer; touch-action:manipulation; outline:none;
    border-radius:28px;
  }
  #stage:focus-visible{ box-shadow:0 0 0 4px #e8a54b; }
  #stage svg.dog{ width:100%; height:100%; display:block; overflow:visible; }
  .hint{
    display:flex; justify-content:space-between; width:min(92vw,560px);
    padding:2px 10px 0; font-weight:700; color:#a07a4e; font-size:clamp(.9rem,2.8vw,1.05rem);
  }
  #counter{
    margin-top:10px; background:#fffdf7; border:3px solid #f0d9ae; color:#7a5a33;
    font-weight:800; font-size:1.05rem; padding:6px 18px; border-radius:999px;
    box-shadow:0 3px 0 #ecd7ab;
  }
  footer{ margin-top:auto; padding:22px 16px 26px; text-align:center; color:#9b7c55; font-weight:600; font-size:.98rem; }
  footer .idea{ color:#b45a1b; font-weight:800; }
  .heart{
    position:absolute; pointer-events:none; z-index:5;
    animation:floatUp 1.15s ease-out forwards;
  }
  @keyframes floatUp{
    0%{ transform:translate(-50%,-50%) scale(.5) rotate(0deg); opacity:0; }
    15%{ opacity:1; }
    100%{ transform:translate(-50%,-190%) scale(1.15) rotate(var(--spin,10deg)); opacity:0; }
  }
  .eye{ transform-box:fill-box; transform-origin:center; animation:blink 4.8s infinite; }
  @keyframes blink{ 0%,91%,100%{ transform:scaleY(1);} 94%{ transform:scaleY(.08);} 97%{ transform:scaleY(1);} }
  #breath{ transform-box:fill-box; transform-origin:50% 100%; animation:breath 3.4s ease-in-out infinite alternate; }
  @keyframes breath{ from{ transform:scale(1,1);} to{ transform:scale(1.012,1.02);} }
  #head{ transform-box:fill-box; transform-origin:50% 88%; transition:transform .18s ease; transform:rotate(2deg); }
  .happy-tilt-l #head{ transform:rotate(-4.5deg); }
  .happy-tilt-r #head{ transform:rotate(4.5deg); }
  .mouthClosed{ transition:opacity .15s ease; }
  .happy .mouthClosed{ opacity:0; }
  #openSmile{ opacity:0; transition:opacity .15s ease; }
  .happy #openSmile{ opacity:1; }
  .earL,.earR{ transform-box:fill-box; }
  .earL{ transform-origin:85% 8%; } .earR{ transform-origin:15% 8%; }
  .happy .earL{ animation:earWigL .34s ease-in-out 5 alternate; }
  .happy .earR{ animation:earWigR .34s ease-in-out 5 alternate; }
  @keyframes earWigL{ from{ transform:rotate(0);} to{ transform:rotate(-4deg);} }
  @keyframes earWigR{ from{ transform:rotate(0);} to{ transform:rotate(4deg);} }
</style>
</head>
<body>
<header>
  <h1><span class="paw">🐾</span> Teddy Wags</h1>
  <p class="sub">Click Teddy's left and his booty swings left. Click his right, it swings right.</p>
</header>
<div id="status" aria-live="polite">Go on, give Teddy a click.</div>

<div id="stage" role="button" tabindex="0" aria-label="Play with Teddy. Activate the left side to swing his booty left, the right side to swing it right.">
<svg class="dog" viewBox="0 0 640 600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

      <ellipse cx="224" cy="450" rx="44" ry="56" fill="#e8cf9e" opacity="0.35"/>

      <path d="M158 510 l6 9 M176 508 l4 10" stroke="#dfc493" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
      <path d="M464 508 l-4 10 M482 510 l-6 9" stroke="#dfc493" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
    </g>

    <!-- FRONT assembly: planted. Chest subgroup gets a tiny lagged counter-sway. -->

      <g id="chest">

        <path d="M320 356 C282 356 263 394 267 434 C270 469 293 494 320 494 C347 494 370 469 373 434 C377 394 358 356 320 356 Z" fill="url(#bibGrad)" opacity="0.95"/>
        <ellipse cx="320" cy="278" rx="86" ry="17" fill="#dfc28c" opacity="0.4"/>
        <!-- blue houndstooth bandana -->
        <path d="M238 288 Q320 332 402 288 L388 322 Q320 442 320 442 Q320 442 252 322 Z" fill="url(#hound)"/>
        <path d="M238 288 Q320 332 402 288 L388 322 Q320 442 320 442 Q320 442 252 322 Z" fill="none" stroke="#2f4c7c" stroke-width="5" stroke-linejoin="round"/>
        <g transform="rotate(16 382 318)">
          <rect x="366" y="300" width="33" height="38" rx="9" fill="#41619b" stroke="#2f4c7c" stroke-width="4"/>
          <path d="M374 338 l-4 32 M392 338 l6 30" stroke="#41619b" stroke-width="11" stroke-linecap="round"/>
        </g>
      </g>
      <!-- front legs + paws: fully static, planted -->
      <path d="M283 402 v96" stroke="#f9edd4" stroke-width="36" stroke-linecap="round"/>
      <path d="M357 402 v96" stroke="#f9edd4" stroke-width="36" stroke-linecap="round"/>
      <ellipse cx="283" cy="514" rx="30" ry="14" fill="#fdf6e7"/>
      <ellipse cx="357" cy="514" rx="30" ry="14" fill="#fdf6e7"/>
      <path d="M273 505 v10 M293 505 v10" stroke="#dfc493" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
      <path d="M347 505 v10 M367 505 v10" stroke="#dfc493" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
    </g>

    <!-- HEAD -->
    <g id="headSway">
    <g id="head">
      <!-- neck ruff: grows the head into the chest so they read as one dog -->
      <path d="M320 232 C262 232 234 258 237 292 C239 316 260 330 284 325 L291 343 L305 330 L320 346 L335 330 L349 343 L356 325 C380 330 401 316 403 292 C406 258 378 232 320 232 Z" fill="url(#bodyGrad)"/>
      <g class="earL">
        <path d="M248 94 C206 98 187 138 189 195 C190 232 195 262 204 282 L212 268 L219 286 L227 268 L235 284 C241 262 244 232 245 196 C247 160 258 128 263 112 C266 100 260 92 248 94 Z" fill="url(#earGrad)"/>
        <path d="M233 118 C215 132 207 170 210 212 C212 242 217 260 223 266 C231 248 235 212 236 174 C237 146 237 126 233 118 Z" fill="#f9edd4" opacity="0.75"/>
      </g>
      <g transform="translate(640 0) scale(-1 1)">
        <g class="earR">
          <path d="M248 94 C206 98 187 138 189 195 C190 232 195 262 204 282 L212 268 L219 286 L227 268 L235 284 C241 262 244 232 245 196 C247 160 258 128 263 112 C266 100 260 92 248 94 Z" fill="url(#earGrad)"/>
          <path d="M233 118 C215 132 207 170 210 212 C212 242 217 260 223 266 C231 248 235 212 236 174 C237 146 237 126 233 118 Z" fill="#f9edd4" opacity="0.75"/>
        </g>
      </g>
      <!-- one-piece skull with the tuft in the silhouette -->
      <path d="M274 274 C242 254 223 215 222 170 C221 128 240 92 274 74 C281 58 300 50 320 55 C340 50 359 58 366 74 C400 92 419 128 418 170 C417 215 398 254 366 274 Z" fill="url(#headGrad)"/>
      <ellipse cx="320" cy="108" rx="54" ry="28" fill="#fdf3dd" opacity="0.8"/>
      <circle cx="240" cy="228" r="20" fill="url(#headGrad)"/>
      <circle cx="400" cy="228" r="20" fill="url(#headGrad)"/>
      <ellipse cx="243" cy="205" rx="16" ry="9" fill="#f0b98a" opacity="0.3"/>
      <ellipse cx="397" cy="205" rx="16" ry="9" fill="#f0b98a" opacity="0.3"/>
      <ellipse cx="272" cy="126" rx="21" ry="10" fill="#fff6e3" opacity="0.95" transform="rotate(-8 272 126)"/>
      <ellipse cx="368" cy="126" rx="21" ry="10" fill="#fff6e3" opacity="0.95" transform="rotate(8 368 126)"/>
      <!-- muzzle + mustache + beard, one shared gradient -->
      <ellipse cx="320" cy="218" rx="58" ry="43" fill="url(#muzzleGrad)"/>
      <ellipse cx="287" cy="224" rx="23" ry="14" fill="url(#muzzleGrad)" transform="rotate(-14 287 224)"/>
      <ellipse cx="353" cy="224" rx="23" ry="14" fill="url(#muzzleGrad)" transform="rotate(14 353 224)"/>
      <circle cx="291" cy="256" r="15" fill="url(#muzzleGrad)"/>
      <circle cx="320" cy="265" r="18" fill="url(#muzzleGrad)"/>
      <circle cx="349" cy="256" r="15" fill="url(#muzzleGrad)"/>
      <!-- eyes -->
      <g class="eye">
        <circle cx="272" cy="150" r="14" fill="#38271c"/>
        <circle cx="267" cy="144" r="5" fill="#ffffff"/>
        <circle cx="277" cy="155" r="2.4" fill="#ffffff" opacity="0.9"/>
      </g>
      <g class="eye">
        <circle cx="368" cy="150" r="14" fill="#38271c"/>
        <circle cx="363" cy="144" r="5" fill="#ffffff"/>
        <circle cx="373" cy="155" r="2.4" fill="#ffffff" opacity="0.9"/>
      </g>
      <path d="M254 138 Q272 129 290 138 M350 138 Q368 129 386 138" stroke="#e0c48f" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8"/>
      <!-- nose (click it for a boop) -->
      <g id="nose">
        <ellipse cx="320" cy="194" rx="20" ry="14.5" fill="#62422e"/>
        <ellipse cx="312" cy="187" rx="7" ry="4.2" fill="#ffffff" opacity="0.55"/>
        <circle cx="331" cy="190" r="2" fill="#ffffff" opacity="0.35"/>

      <!-- mouth: closed smile at rest, big open grin when happy -->
      <path class="mouthClosed" d="M320 208 v7 M320 215 q-10 10 -22 5 M320 215 q10 10 22 5" stroke="#8a6a4d" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <g id="openSmile">
        <path d="M295 212 Q320 224 345 212 Q342 244 320 244 Q298 244 295 212 Z" fill="#7c4634"/>
        <path d="M306 232 h28 v12 q0 13 -14 13 q-14 0 -14 -13 Z" fill="#f28ba8"/>
        <path d="M320 238 v12" stroke="#dd6d8f" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>
    </g>
  </g>
</svg>
</div>

<div class="hint"><span>← booty left</span><span>booty right →</span></div>
<div id="counter">Wags: 0</div>

<footer>
  <p><span class="idea">Kate's idea.</span> Built for Teddy, a very good cockapoo with one very waggy tail.</p>
</footer>

<script>
(function(){
  var stage = document.getElementById('stage');
  var tailWrap = document.getElementById('tailWrap');
  var tail = document.getElementById('tail');
  var rear = document.getElementById('rear');
  var chest = document.getElementById('chest');
  var headSway = document.getElementById('headSway');
  var status = document.getElementById('status');
  var counter = document.getElementById('counter');
  var wags = 0;
  var TAU = Math.PI * 2;
  // Continuous wag simulation: the phase never resets and every part eases
  // toward its target, so switching sides mid-wag glides instead of snapping.
  // targetSide is the lean target: +1 = booty left, -1 = booty right.
  // The tail target is the opposite sign (scaleX +1 draws it on the right).
  var phase = 0, amp = 0, lean = 0, tailSide = 1;
  var targetSide = -1, excitedUntil = 0, lastFrame = 0, loopRunning = false;

  var msgs = {
    left:  ["Booty swings left!", "Teddy wags left!", "Full wiggle, left side!", "That booty is swinging left."],
    right: ["Booty swings right!", "Teddy wags right!", "Full wiggle, right side!", "That booty is swinging right."],
    boop:  ["Boop! Right on the nose.", "Boop achieved. Teddy approves.", "A perfect boop."]
  };
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

  function frame(now){
    var dt = Math.min(64, now - (lastFrame || now));
    lastFrame = now;
    var excited = now < excitedUntil;
    var ampTarget = excited ? 1 : 0;
    var tau = ampTarget > amp ? 90 : 480;
    amp += (ampTarget - amp) * (1 - Math.exp(-dt / tau));
    if(!excited && amp < 0.003) amp = 0;
    lean += (targetSide - lean) * (1 - Math.exp(-dt / 170));
    tailSide += ((-targetSide) - tailSide) * (1 - Math.exp(-dt / 150));
    phase += dt * TAU / 460;

    var rearAngle = amp * (lean * 5 + 7 * Math.sin(phase));
    rear.setAttribute('transform', rearAngle ? 'rotate(' + rearAngle.toFixed(2) + ' 320 330)' : '');
    var tailAngle = 6 + amp * (-9 + 17 * Math.sin(2 * phase - 0.9));
    tail.setAttribute('transform', 'rotate(' + tailAngle.toFixed(2) + ' 418 470)');
    // easing scaleX through 0 swings the tail behind his body to the other side
    tailWrap.setAttribute('transform', 'translate(320 0) scale(' + tailSide.toFixed(3) + ' 1) translate(-320 0)');
    var chestAngle = -amp * 2.1 * Math.sin(phase - 0.7);
    chest.setAttribute('transform', chestAngle ? 'rotate(' + chestAngle.toFixed(2) + ' 320 300)' : '');
    var headAngle = amp * 1.2 * Math.sin(phase - 1.2);
    headSway.setAttribute('transform', headAngle ? 'rotate(' + headAngle.toFixed(2) + ' 320 250)' : '');

    if(amp > 0.12 || excited){
      if(!stage.classList.contains('happy')){
        stage.classList.add('happy', targetSide > 0 ? 'happy-tilt-l' : 'happy-tilt-r');
      }
    } else {
      stage.classList.remove('happy','happy-tilt-l','happy-tilt-r');
    }

    var settled = !excited && amp === 0 &&
      Math.abs(lean - targetSide) < 0.002 && Math.abs(tailSide + targetSide) < 0.002;
    if(!settled){
      requestAnimationFrame(frame);
    } else {
      loopRunning = false;
      rear.setAttribute('transform', '');
      chest.setAttribute('transform', '');
      headSway.setAttribute('transform', '');
      tail.setAttribute('transform', 'rotate(6 418 470)');
    }
  }

  function startLoop(){
    if(!loopRunning){ loopRunning = true; lastFrame = 0; requestAnimationFrame(frame); }
  }

  function hearts(x, y, n){
    for(var i = 0; i < n; i++){
      var s = document.createElementNS('http://www.w3.org/2000/svg','svg');
      s.setAttribute('viewBox','0 0 24 24');
      s.innerHTML = '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#ef7d9b"/>';
      s.classList.add('heart');
      var size = 16 + Math.random() * 16;
      s.style.width = size + 'px'; s.style.height = size + 'px';
      s.style.left = (x + (Math.random() * 90 - 45)) + 'px';
      s.style.top = (y + (Math.random() * 30 - 15)) + 'px';
      s.style.setProperty('--spin', (Math.random() * 36 - 18) + 'deg');
      stage.appendChild(s);
      (function(el){ setTimeout(function(){ el.remove(); }, 1250); })(s);
    }
  }

  function doWag(side, x, y, isBoop){
    wags++;
    counter.textContent = 'Wags: ' + wags;
    status.textContent = isBoop ? pick(msgs.boop) : pick(msgs[side]);
    targetSide = side === 'left' ? 1 : -1;
    excitedUntil = performance.now() + 2100;
    stage.classList.remove('happy-tilt-l','happy-tilt-r');
    stage.classList.add('happy', side === 'left' ? 'happy-tilt-l' : 'happy-tilt-r');
    hearts(x, y, isBoop ? 7 : 5);
    startLoop();
  }

  var lastPointerAt = 0;
  stage.addEventListener('pointerdown', function(e){
    var nowMs = performance.now();
    if(nowMs - lastPointerAt < 120) return;
    lastPointerAt = nowMs;
    var r = stage.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    var tg = e.target;
    var isBoop = tg && tg.closest && !!tg.closest('#nose');
    var side = x < r.width / 2 ? 'left' : 'right';
    doWag(side, x, y, isBoop);
  });

  stage.addEventListener('keydown', function(e){
    var r = stage.getBoundingClientRect();
    if(e.key === 'ArrowLeft'){ e.preventDefault(); doWag('left', r.width * 0.3, r.height * 0.4, false); }
    if(e.key === 'ArrowRight'){ e.preventDefault(); doWag('right', r.width * 0.7, r.height * 0.4, false); }
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); doWag(Math.random() < 0.5 ? 'left' : 'right', r.width / 2, r.height * 0.4, false); }
  });
})();
</script>
</body>
</html>
