<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teddy Wags — click a side, he wags that side</title>
<meta name="description" content="Teddy the cockapoo wags his little docked tail on whichever side you click. Kate's idea.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#4a3826; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:"Baloo 2", ui-rounded, "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
    background:linear-gradient(180deg,#fff6e2 0%,#ffecca 55%,#ffe3ae 100%);
    color:#4a3826;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; overflow-x:hidden;
    user-select:none; -webkit-user-select:none;
  }
  header{ text-align:center; padding:26px 16px 4px; }
  h1{ font-size:clamp(2rem,6vw,3.2rem); font-weight:800; letter-spacing:.5px; color:#5b4028; }
  h1 .paw{ display:inline-block; transform:rotate(-12deg); }
  .sub{ font-size:clamp(1rem,3vw,1.25rem); font-weight:600; color:#8a6a45; margin-top:2px; }
  #status{
    margin-top:14px; min-height:2.2em; font-size:clamp(1.15rem,3.6vw,1.6rem);
    font-weight:800; color:#b45a1b; text-align:center; padding:0 12px;
  }
  #stage{
    position:relative; width:min(92vw,560px); aspect-ratio:640/600;
    cursor:pointer; touch-action:manipulation; outline:none;
    border-radius:28px;
  }
  #stage:focus-visible{ box-shadow:0 0 0 4px #e8a54b; }
  #stage svg.dog{ width:100%; height:100%; display:block; overflow:visible; }
  .hint{
    display:flex; justify-content:space-between; width:min(92vw,560px);
    padding:2px 10px 0; font-weight:700; color:#a07a4e; font-size:clamp(.9rem,2.8vw,1.05rem);
  }
  #counter{
    margin-top:10px; background:#fffdf7; border:3px solid #f0d9ae; color:#7a5a33;
    font-weight:800; font-size:1.05rem; padding:6px 18px; border-radius:999px;
    box-shadow:0 3px 0 #ecd7ab;
  }
  footer{ margin-top:auto; padding:22px 16px 26px; text-align:center; color:#9b7c55; font-weight:600; font-size:.98rem; }
  footer .idea{ color:#b45a1b; font-weight:800; }
  .heart{
    position:absolute; pointer-events:none; z-index:5;
    animation:floatUp 1.15s ease-out forwards;
  }
  @keyframes floatUp{
    0%{ transform:translate(-50%,-50%) scale(.5) rotate(0deg); opacity:0; }
    15%{ opacity:1; }
    100%{ transform:translate(-50%,-190%) scale(1.15) rotate(var(--spin,10deg)); opacity:0; }
  }
  /* idle life */
  .eye{ transform-box:fill-box; transform-origin:center; animation:blink 4.8s infinite; }
  @keyframes blink{ 0%,91%,100%{ transform:scaleY(1);} 94%{ transform:scaleY(.08);} 97%{ transform:scaleY(1);} }
  #breath{ transform-box:fill-box; transform-origin:50% 100%; animation:breath 3.4s ease-in-out infinite alternate; }
  @keyframes breath{ from{ transform:scale(1,1);} to{ transform:scale(1.012,1.02);} }
  /* happy state */
  #dogBounce{ transform-box:fill-box; transform-origin:50% 100%; }
  .happy #dogBounce{ animation:bounce .38s ease-in-out 5; }
  @keyframes bounce{ 0%,100%{ transform:translateY(0);} 35%{ transform:translateY(-13px);} 70%{ transform:translateY(1px);} }
  #head{ transform-box:fill-box; transform-origin:50% 88%; transition:transform .18s ease; }
  .happy-tilt-l #head{ transform:rotate(-6deg); }
  .happy-tilt-r #head{ transform:rotate(6deg); }
  #tongue{ transform-box:fill-box; transform-origin:50% 0%; transform:scaleY(0); transition:transform .16s ease; }
  .happy #tongue{ transform:scaleY(1); }
  .earL,.earR{ transform-box:fill-box; }
  .earL{ transform-origin:85% 8%; } .earR{ transform-origin:15% 8%; }
  .happy .earL{ animation:earWigL .3s ease-in-out 6 alternate; }
  .happy .earR{ animation:earWigR .3s ease-in-out 6 alternate; }
  @keyframes earWigL{ from{ transform:rotate(0);} to{ transform:rotate(-7deg);} }
  @keyframes earWigR{ from{ transform:rotate(0);} to{ transform:rotate(7deg);} }
</style>
</head>
<body>
<header>
  <h1><span class="paw">🐾</span> Teddy Wags</h1>
  <p class="sub">Click the left side of Teddy, he wags left. Click the right side, he wags right.</p>
</header>
<div id="status" aria-live="polite">Go on, give Teddy a click.</div>

<div id="stage" role="button" tabindex="0" aria-label="Play with Teddy. Activate the left side to make him wag left, the right side to wag right.">
<svg class="dog" viewBox="0 0 640 600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <pattern id="hound" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#41619b"/>
      <rect x="0" y="0" width="9" height="9" fill="#f4f7fc"/>
      <rect x="9" y="9" width="9" height="9" fill="#f4f7fc"/>
      <rect x="4.5" y="4.5" width="9" height="9" fill="#7e97c4" opacity="0.55"/>
    </pattern>
    <radialGradient id="floorG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e9cf9f"/>
      <stop offset="100%" stop-color="#e9cf9f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="320" cy="530" rx="215" ry="34" fill="url(#floorG)"/>
  <ellipse cx="320" cy="528" rx="168" ry="20" fill="#dfc493" opacity="0.55"/>

  <!-- tails (behind body): fluffy docked pom-poms that swing out on their side -->
  <g id="tailL" transform="rotate(14 238 440)">
    <path d="M238 440 Q178 448 148 416" stroke="#f7e8cb" stroke-width="34" stroke-linecap="round" fill="none"/>
    <circle cx="146" cy="414" r="27" fill="#f7e8cb" stroke="#e6cf9e" stroke-width="2.5"/>
    <circle cx="128" cy="402" r="19" fill="#fdf3dd" stroke="#e6cf9e" stroke-width="2"/>
    <circle cx="160" cy="394" r="16" fill="#fdf3dd" stroke="#e6cf9e" stroke-width="2"/>
    <circle cx="136" cy="428" r="15" fill="#f1deb6" stroke="#e6cf9e" stroke-width="2"/>
  </g>
  <g id="tailR" transform="rotate(-14 402 440)">
    <path d="M402 440 Q462 448 492 416" stroke="#f7e8cb" stroke-width="34" stroke-linecap="round" fill="none"/>
    <circle cx="494" cy="414" r="27" fill="#f7e8cb" stroke="#e6cf9e" stroke-width="2.5"/>
    <circle cx="512" cy="402" r="19" fill="#fdf3dd" stroke="#e6cf9e" stroke-width="2"/>
    <circle cx="480" cy="394" r="16" fill="#fdf3dd" stroke="#e6cf9e" stroke-width="2"/>
    <circle cx="504" cy="428" r="15" fill="#f1deb6" stroke="#e6cf9e" stroke-width="2"/>
  </g>

  <g id="dogBounce">
  <g id="breath">
    <!-- haunches + back paws -->
    <ellipse cx="212" cy="442" rx="64" ry="80" fill="#f3e2c0"/>
    <ellipse cx="428" cy="442" rx="64" ry="80" fill="#f3e2c0"/>
    <ellipse cx="192" cy="522" rx="46" ry="17" fill="#f7e8cb"/>
    <ellipse cx="448" cy="522" rx="46" ry="17" fill="#f7e8cb"/>
    <path d="M178 512 v10 M196 510 v12" stroke="#dfc493" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M434 510 v12 M452 512 v10" stroke="#dfc493" stroke-width="3.5" stroke-linecap="round"/>
    <!-- torso -->
    <ellipse cx="320" cy="398" rx="108" ry="112" fill="#f7e8cb"/>
    <ellipse cx="320" cy="428" rx="80" ry="76" fill="#fdf3dd" opacity="0.75"/>
    <!-- front legs + paws -->
    <path d="M272 430 v76" stroke="#f7e8cb" stroke-width="37" stroke-linecap="round"/>
    <path d="M368 430 v76" stroke="#f7e8cb" stroke-width="37" stroke-linecap="round"/>
    <ellipse cx="272" cy="516" rx="31" ry="15" fill="#fdf6e7"/>
    <ellipse cx="368" cy="516" rx="31" ry="15" fill="#fdf6e7"/>
    <path d="M262 507 v10 M282 507 v10" stroke="#dfc493" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M358 507 v10 M378 507 v10" stroke="#dfc493" stroke-width="3.5" stroke-linecap="round"/>

    <!-- blue houndstooth bandana -->
    <path d="M232 296 Q320 338 408 296 L392 330 Q320 448 320 448 Q320 448 248 330 Z" fill="url(#hound)"/>
    <path d="M232 296 Q320 338 408 296 L392 330 Q320 448 320 448 Q320 448 248 330 Z" fill="none" stroke="#2f4c7c" stroke-width="5" stroke-linejoin="round"/>
    <g transform="rotate(18 384 330)">
      <rect x="368" y="312" width="34" height="40" rx="9" fill="#41619b" stroke="#2f4c7c" stroke-width="4"/>
      <path d="M376 352 l-4 34 M394 352 l6 32" stroke="#41619b" stroke-width="11" stroke-linecap="round"/>
    </g>

    <!-- head -->
    <g id="head">
      <!-- ears -->
      <g class="earL">
        <path d="M238 108 C196 116 182 168 190 226 C195 264 204 292 218 292 C234 292 240 258 242 214 C244 168 252 116 238 108 Z" fill="#eed9ae"/>
        <path d="M226 140 C206 152 200 196 205 238" stroke="#e0c48f" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.8"/>
      </g>
      <g class="earR">
        <path d="M402 108 C444 116 458 168 450 226 C445 264 436 292 422 292 C406 292 400 258 398 214 C396 168 388 116 402 108 Z" fill="#eed9ae"/>
        <path d="M414 140 C434 152 440 196 435 238" stroke="#e0c48f" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.8"/>
      </g>
      <!-- fluffy head silhouette -->
      <circle cx="320" cy="176" r="90" fill="#f7e8cb"/>
      <circle cx="252" cy="212" r="44" fill="#f7e8cb"/>
      <circle cx="388" cy="212" r="44" fill="#f7e8cb"/>
      <circle cx="276" cy="100" r="34" fill="#f7e8cb"/>
      <circle cx="320" cy="90" r="38" fill="#f7e8cb"/>
      <circle cx="364" cy="100" r="34" fill="#f7e8cb"/>
      <circle cx="320" cy="94" r="30" fill="#fdf3dd"/>
      <!-- brow tufts -->
      <ellipse cx="272" cy="128" rx="25" ry="12" fill="#fff6e3" transform="rotate(-9 272 128)"/>
      <ellipse cx="368" cy="128" rx="25" ry="12" fill="#fff6e3" transform="rotate(9 368 128)"/>
      <!-- muzzle + beard -->
      <ellipse cx="320" cy="216" rx="56" ry="42" fill="#fffaf0"/>
      <circle cx="290" cy="246" r="17" fill="#fffaf0"/>
      <circle cx="320" cy="252" r="19" fill="#fffaf0"/>
      <circle cx="350" cy="246" r="17" fill="#fffaf0"/>
      <!-- blush -->
      <ellipse cx="238" cy="198" rx="15" ry="8" fill="#f2a48d" opacity="0.5"/>
      <ellipse cx="402" cy="198" rx="15" ry="8" fill="#f2a48d" opacity="0.5"/>
      <!-- eyes -->
      <g class="eye">
        <circle cx="274" cy="156" r="13.5" fill="#3a2a20"/>
        <circle cx="269" cy="150" r="4.6" fill="#ffffff"/>
        <circle cx="279" cy="161" r="2.2" fill="#ffffff" opacity="0.9"/>
      </g>
      <g class="eye">
        <circle cx="366" cy="156" r="13.5" fill="#3a2a20"/>
        <circle cx="361" cy="150" r="4.6" fill="#ffffff"/>
        <circle cx="371" cy="161" r="2.2" fill="#ffffff" opacity="0.9"/>
      </g>
      <!-- nose (click it for a boop) -->
      <g id="nose">
        <ellipse cx="320" cy="196" rx="22" ry="16" fill="#6b4632"/>
        <ellipse cx="312" cy="189" rx="7.5" ry="4.5" fill="#ffffff" opacity="0.5"/>
        <circle cx="313" cy="199" r="2.6" fill="#4e3220"/>
        <circle cx="327" cy="199" r="2.6" fill="#4e3220"/>
      </g>
      <!-- mouth + tongue -->
      <path d="M320 212 v7 M320 219 q-9 9 -19 4 M320 219 q9 9 19 4" stroke="#8a6a4d" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <g id="tongue">
        <path d="M306 226 h28 v16 q0 14 -14 14 q-14 0 -14 -14 Z" fill="#f28ba8"/>
        <path d="M320 232 v16" stroke="#dd6d8f" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>
  </g>
  </g>
</svg>
</div>

<div class="hint"><span>← wag left</span><span>wag right →</span></div>
<div id="counter">Wags: 0</div>

<footer>
  <p><span class="idea">Kate's idea.</span> Built for Teddy, a very good cockapoo with a very waggy little tail.</p>
</footer>

<script>
(function(){
  var stage = document.getElementById('stage');
  var tailL = document.getElementById('tailL');
  var tailR = document.getElementById('tailR');
  var status = document.getElementById('status');
  var counter = document.getElementById('counter');
  var wags = 0;
  var wag = null; // {side, start}
  var DURATION = 2000;

  var msgs = {
    left:  ["Teddy wags left!", "Left-side wags, best wags.", "Wagging left for you!", "That left side never misses."],
    right: ["Teddy wags right!", "Right-side wags, best wags.", "Wagging right for you!", "That right side never misses."],
    boop:  ["Boop! Right on the nose.", "Boop achieved. Teddy approves.", "A perfect boop."]
  };
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

  function setTail(el, angle, cx){
    el.setAttribute('transform', 'rotate(' + angle.toFixed(2) + ' ' + cx + ' 440)');
  }

  function frame(now){
    if(!wag) return;
    var t = (now - wag.start) / DURATION;
    if(t >= 1){
      setTail(tailL, 14, 238); setTail(tailR, -14, 402);
      stage.classList.remove('happy','happy-tilt-l','happy-tilt-r');
      wag = null; return;
    }
    var env = Math.pow(1 - t, 0.55) * Math.min(1, t / 0.08 + 0.25);
    var osc = Math.sin((now - wag.start) / 52) * 25 * env;
    if(wag.side === 'left'){
      setTail(tailL, -(16 + 13 * env) + osc, 238);
      setTail(tailR, -14, 402);
    } else {
      setTail(tailR, (16 + 13 * env) - osc, 402);
      setTail(tailL, 14, 238);
    }
    requestAnimationFrame(frame);
  }

  function hearts(x, y, n){
    for(var i = 0; i < n; i++){
      var s = document.createElementNS('http://www.w3.org/2000/svg','svg');
      s.setAttribute('viewBox','0 0 24 24');
      s.innerHTML = '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#ef7d9b"/>';
      s.classList.add('heart');
      var size = 16 + Math.random() * 16;
      s.style.width = size + 'px'; s.style.height = size + 'px';
      s.style.left = (x + (Math.random() * 90 - 45)) + 'px';
      s.style.top = (y + (Math.random() * 30 - 15)) + 'px';
      s.style.setProperty('--spin', (Math.random() * 36 - 18) + 'deg');
      stage.appendChild(s);
      (function(el){ setTimeout(function(){ el.remove(); }, 1250); })(s);
    }
  }

  function doWag(side, x, y, isBoop){
    wags++;
    counter.textContent = 'Wags: ' + wags;
    status.textContent = isBoop ? pick(msgs.boop) : pick(msgs[side]);
    wag = { side: side, start: performance.now() };
    stage.classList.remove('happy-tilt-l','happy-tilt-r');
    void stage.offsetWidth;
    stage.classList.add('happy', side === 'left' ? 'happy-tilt-l' : 'happy-tilt-r');
    hearts(x, y, isBoop ? 7 : 5);
    requestAnimationFrame(frame);
  }

  var lastPointerAt = 0;
  stage.addEventListener('pointerdown', function(e){
    var nowMs = performance.now();
    if(nowMs - lastPointerAt < 120) return; // swallow synthetic double-fires
    lastPointerAt = nowMs;
    var r = stage.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    var tg = e.target;
    var isBoop = tg && tg.closest && !!tg.closest('#nose');
    var side = x < r.width / 2 ? 'left' : 'right';
    doWag(side, x, y, isBoop);
  });

  stage.addEventListener('keydown', function(e){
    var r = stage.getBoundingClientRect();
    if(e.key === 'ArrowLeft'){ e.preventDefault(); doWag('left', r.width * 0.3, r.height * 0.4, false); }
    if(e.key === 'ArrowRight'){ e.preventDefault(); doWag('right', r.width * 0.7, r.height * 0.4, false); }
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); doWag(Math.random() < 0.5 ? 'left' : 'right', r.width / 2, r.height * 0.4, false); }
  });
})();
</script>
</body>
</html>
