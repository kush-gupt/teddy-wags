<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teddy Wags — click a side, watch the booty shift</title>
<meta name="description" content="Teddy the cockapoo wiggles his whole rear end toward whichever side you click. Kate's idea.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:'Baloo 2', ui-rounded, system-ui, sans-serif;
    background:linear-gradient(180deg, #fdf3e0 0%, #fbe8cd 55%, #f7ddba 100%);
    color:#5b4632;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:24px 12px 16px;
    -webkit-tap-highlight-color:transparent;
  }
  h1 { font-size:clamp(30px, 6vw, 46px); font-weight:800; letter-spacing:.5px; color:#7a4b21; }
  h1 .paw { color:#d98a3d; }
  #status { font-size:clamp(17px, 3.4vw, 22px); font-weight:700; color:#96682f; min-height:1.5em; margin-top:2px; text-align:center; }
  #counter {
    margin-top:8px; background:#fffdf7; border:2px solid #e8c98f; color:#96682f;
    font-weight:800; font-size:16px; padding:4px 16px; border-radius:999px;
    box-shadow:0 2px 0 #e8c98f; visibility:hidden;
  }
  #stage {
    position:relative; width:min(92vw, 560px); margin-top:6px;
    cursor:pointer; touch-action:manipulation; user-select:none; -webkit-user-select:none;
    outline:none;
  }
  #stage:focus-visible { filter:drop-shadow(0 0 10px rgba(217,138,61,.55)); border-radius:24px; }
  svg.dog { width:100%; height:auto; display:block; overflow:visible; }

  #breath { transform-box:fill-box; transform-origin:50% 60%; animation:breathe 3.6s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform:scale(1,1); } 50% { transform:scale(1.012,1.02); } }

  .eye { transform-box:fill-box; transform-origin:center; animation:blink 4.6s infinite; }
  @keyframes blink { 0%, 92%, 100% { transform:scaleY(1); } 95% { transform:scaleY(.08); } }

  #head { transform-box:fill-box; transform-origin:50% 88%; transform:rotate(0deg); transition:transform .25s ease; }
  .happy-tilt-l #head{ transform:rotate(-4deg); }
  .happy-tilt-r #head{ transform:rotate(4deg); }

  .earL, .earR { transform-box:fill-box; }
  .earL { transform-origin:70% 6%; }
  .earR { transform-origin:30% 6%; }
  .happy .earL { animation:earWiggleL .46s ease-in-out infinite; }
  .happy .earR { animation:earWiggleR .46s ease-in-out infinite .08s; }
  @keyframes earWiggleL { 0%,100% { transform:rotate(0deg); } 50% { transform:rotate(-6deg); } }
  @keyframes earWiggleR { 0%,100% { transform:rotate(0deg); } 50% { transform:rotate(6deg); } }

  .grin, .tongue { opacity:0; transition:opacity .18s ease; }
  .happy .grin, .happy .tongue { opacity:1; }
  .happy .smile { opacity:0; }
  .smile { transition:opacity .18s ease; }
  .happy .eye { animation:none; transform:scale(1.15); }
  .brow { opacity:0; transition:opacity .18s ease; }
  .happy .brow { opacity:1; }

  .heart { position:absolute; pointer-events:none; animation:floatUp 1.15s ease-out forwards; z-index:5; line-height:1; }
  @keyframes floatUp {
    0% { transform:translate(-50%,-50%) scale(.5) rotate(0deg); opacity:0; }
    15% { opacity:1; }
    100% { transform:translate(calc(-50% + var(--dx)), calc(-50% - 120px)) scale(1.15) rotate(var(--rot)); opacity:0; }
  }
  .hint { margin-top:10px; font-size:15px; font-weight:600; color:#b0824a; text-align:center; }
  footer { margin-top:auto; padding-top:14px; font-size:13.5px; color:#bfa07a; font-weight:600; text-align:center; }
</style>
</head>
<body>
  <h1>Teddy Wags <span class="paw">🐾</span></h1>
  <div id="status" aria-live="polite">Go on, give Teddy a click.</div>
  <div id="counter">Wags: 0</div>

  <div id="stage" role="button" tabindex="0" aria-label="Teddy the cockapoo. Click the left side to shift his booty left, the right side to shift it right.">
    <svg class="dog" viewBox="0 0 640 600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="bodyGrad" gradientUnits="userSpaceOnUse" x1="0" y1="195" x2="0" y2="455">
          <stop offset="0" stop-color="#f8ead0"/>
          <stop offset=".45" stop-color="#f2ddae"/>
          <stop offset=".78" stop-color="#ead09e"/>
          <stop offset="1" stop-color="#dfbe82"/>
        </linearGradient>
        <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fffaf0"/>
          <stop offset=".6" stop-color="#fdf3da"/>
          <stop offset="1" stop-color="#f0dbab"/>
        </linearGradient>
        <linearGradient id="earGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f7e6c2"/>
          <stop offset="1" stop-color="#e6c78f"/>
        </linearGradient>
        <linearGradient id="bibGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fffdf6"/>
          <stop offset="1" stop-color="#f2e3c2"/>
        </linearGradient>
        <linearGradient id="muzzleGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fffefb"/>
          <stop offset="1" stop-color="#f5e9cd"/>
        </linearGradient>
        <radialGradient id="tailGrad" cx=".38" cy=".32" r=".85">
          <stop offset="0" stop-color="#f9ecd2"/>
          <stop offset="1" stop-color="#e7ca92"/>
        </radialGradient>
      </defs>

      <ellipse cx="320" cy="534" rx="228" ry="23" fill="#8a6134" opacity=".14"/>

      <!-- REAR: back, big round rump, back legs, pom tail. It SHIFTS side to
           side across center while the front end stays planted. -->
      <g id="rear">
        <!-- far back leg -->
        <path d="M506 378 L546 378 L544 490 Q544 512 523 512 Q503 512 504 490 Z" fill="#e9d09c"/>
        <ellipse cx="524" cy="515" rx="25" ry="12" fill="#f3e3c0"/>
        <!-- back + rump, spanning deep under the chest so no gap opens -->
        <path d="M285 250 C330 220 400 202 462 208 C524 214 562 252 568 308 C573 356 552 402 508 424 C478 438 448 436 428 442 C412 447 396 436 384 442 C362 450 338 442 330 430 C306 420 288 394 284 350 C281 312 278 272 285 250 Z" fill="url(#bodyGrad)" stroke="rgba(196,158,96,.30)" stroke-width="2"/>
        <!-- rump shading -->
        <path d="M548 262 C570 296 572 344 556 384 C568 338 566 296 548 262 Z" fill="rgba(190,150,88,.25)"/>
        <!-- near back leg with a fluffy skirt over the hip -->
        <path d="M442 394 C438 434 440 470 442 494 Q443 514 464 514 Q485 514 484 494 L483 396 C471 410 453 410 442 394 Z" fill="url(#bodyGrad)"/>
        <ellipse cx="463" cy="517" rx="27" ry="13" fill="#f8ecd4"/>
        <path d="M452 511 v6 M464 513 v6 M476 511 v6" stroke="#dcc08c" stroke-width="2" stroke-linecap="round"/>
        <!-- docked pom tail on top of the rump, like the real Ted -->
        <g id="tail">
          <path d="M486 226 Q492 196 506 186" fill="none" stroke="#ecd7a8" stroke-width="17" stroke-linecap="round"/>
          <g fill="url(#tailGrad)" stroke="rgba(186,146,88,.45)" stroke-width="1.5">
            <circle cx="512" cy="172" r="23"/>
            <circle cx="492" cy="189" r="18"/>
            <circle cx="531" cy="189" r="16"/>
            <circle cx="510" cy="155" r="15"/>
          </g>
        </g>
      </g>

      <!-- MID: fluff patch over the waist that slides at half the rear's
           shift, so the body bends like a spine instead of hinging -->
      <g id="mid">
        <path d="M282 244 C318 228 348 246 352 296 C355 346 348 400 322 428 C302 446 280 434 275 398 C269 350 270 278 282 244 Z" fill="url(#bodyGrad)"/>
      </g>

      <!-- FRONT: planted. Chest breathes and shimmies a touch; legs never move. -->
      <g id="front">
        <g id="breath">
          <g id="chest">
            <path d="M232 300 C220 356 230 410 260 442 C284 468 330 468 352 440 C372 414 374 354 362 310 C350 268 322 250 294 254 C264 258 240 272 232 300 Z" fill="url(#bibGrad)"/>
            <!-- navy plaid bandana, like his birthday one -->
            <path d="M230 292 Q296 330 364 290 L357 322 Q297 356 238 324 Z" fill="#274b73"/>
            <path d="M246 298 L252 332 M284 312 L288 346 M322 310 L324 342 M352 296 L348 328" stroke="rgba(255,255,255,.20)" stroke-width="5"/>
            <path d="M236 310 Q297 344 360 308" stroke="rgba(140,180,225,.35)" stroke-width="5" fill="none"/>
            <!-- little white paw print -->
            <g fill="#ffffff" opacity=".9" transform="rotate(-8 296 322) scale(1.35) translate(-76 -78)">
              <ellipse cx="296" cy="328" rx="7" ry="5.5"/>
              <circle cx="286" cy="318" r="3.2"/>
              <circle cx="293" cy="314.5" r="3.2"/>
              <circle cx="300" cy="314.5" r="3.2"/>
              <circle cx="307" cy="318" r="3.2"/>
            </g>
            <path d="M348 320 L382 320 L369 368 Q361 378 353 364 Z" fill="#274b73"/>
            <path d="M356 326 L374 326 M360 344 L370 344" stroke="rgba(255,255,255,.20)" stroke-width="4"/>
            <circle cx="362" cy="312" r="11" fill="#1e3a5a"/>
            <circle cx="362" cy="312" r="4.5" fill="#0f2742"/>
          </g>
        </g>
        <!-- front legs: planted, never move -->
        <path d="M248 414 L288 414 L286 494 Q286 514 268 514 Q250 514 251 494 Z" fill="url(#bibGrad)"/>
        <ellipse cx="268" cy="517" rx="27" ry="12.5" fill="#fbf1dc"/>
        <path d="M257 511 v6 M269 513 v6 M280 511 v6" stroke="#e0c892" stroke-width="2" stroke-linecap="round"/>
        <path d="M310 414 L350 414 L349 494 Q349 514 331 514 Q313 514 314 494 Z" fill="url(#bibGrad)"/>
        <ellipse cx="331" cy="517" rx="27" ry="12.5" fill="#fbf1dc"/>
        <path d="M320 511 v6 M332 513 v6 M343 511 v6" stroke="#e0c892" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- HEAD: big, round and front like the photos — the cute anchor.
           It grows out of the chest through a scalloped ruff. -->
      <g id="headSway">
      <g id="head">
        <!-- neck ruff bridging head and chest -->
        <path d="M205 240 C148 240 116 266 119 300 C121 324 142 338 166 332 L173 350 L187 336 L205 354 L223 336 L237 350 L244 332 C268 338 289 324 291 300 C294 266 262 240 205 240 Z" fill="url(#bodyGrad)"/>
        <!-- ears: long, thick, wavy cocker ears -->
        <g class="earL">
          <path d="M142 112 C94 120 70 176 74 240 C77 292 88 332 114 342 C140 352 162 330 166 290 C171 242 168 172 158 134 C152 114 154 108 142 112 Z" fill="url(#earGrad)"/>
          <path d="M128 138 C106 164 98 214 102 264 C104 296 112 318 124 320 C114 268 116 192 128 138 Z" fill="#fbf0d8" opacity=".85"/>
          <path d="M84 250 q10 12 4 26 M92 292 q10 12 4 24" stroke="#dfc493" stroke-width="4" fill="none" stroke-linecap="round"/>
        </g>
        <g class="earR">
          <path d="M268 112 C316 120 340 176 336 240 C333 292 322 332 296 342 C270 352 248 330 244 290 C239 242 242 172 252 134 C258 114 256 108 268 112 Z" fill="url(#earGrad)"/>
          <path d="M282 138 C304 164 312 214 308 264 C306 296 298 318 286 320 C296 268 294 192 282 138 Z" fill="#fbf0d8" opacity=".85"/>
          <path d="M326 250 q-10 12 -4 26 M318 292 q-10 12 -4 24" stroke="#dfc493" stroke-width="4" fill="none" stroke-linecap="round"/>
        </g>
        <!-- skull: big and round -->
        <path d="M205 282 C138 282 92 234 90 172 C88 112 122 66 172 56 C186 44 224 44 238 56 C288 66 322 112 320 172 C318 234 272 282 205 282 Z" fill="url(#headGrad)"/>
        <!-- tuft -->
        <path d="M168 62 C176 34 200 24 207 42 C216 22 242 32 248 58 C234 45 224 50 208 48 C192 50 180 47 168 62 Z" fill="#fffaf0"/>
        <!-- happy brows -->
        <path class="brow" d="M146 146 Q163 135 182 144" fill="none" stroke="#e3c491" stroke-width="5" stroke-linecap="round"/>
        <path class="brow" d="M228 144 Q247 135 264 146" fill="none" stroke="#e3c491" stroke-width="5" stroke-linecap="round"/>
        <!-- big sparkly eyes -->
        <g class="eye">
          <circle cx="162" cy="182" r="13.5" fill="#43302a"/>
          <circle cx="167" cy="176" r="4.6" fill="#ffffff"/>
          <circle cx="157" cy="188" r="2.2" fill="#ffffff" opacity=".9"/>
        </g>
        <g class="eye">
          <circle cx="248" cy="182" r="13.5" fill="#43302a"/>
          <circle cx="253" cy="176" r="4.6" fill="#ffffff"/>
          <circle cx="243" cy="188" r="2.2" fill="#ffffff" opacity=".9"/>
        </g>
        <!-- soft blush -->
        <ellipse cx="128" cy="222" rx="14" ry="8.5" fill="#f6a8a0" opacity=".5"/>
        <ellipse cx="282" cy="222" rx="14" ry="8.5" fill="#f6a8a0" opacity=".5"/>
        <!-- beard: one big fluffy ball with a scalloped chin -->
        <circle cx="171" cy="248" r="26" fill="url(#muzzleGrad)"/>
        <circle cx="205" cy="256" r="31" fill="url(#muzzleGrad)"/>
        <circle cx="239" cy="248" r="26" fill="url(#muzzleGrad)"/>
        <circle cx="182" cy="280" r="13" fill="url(#muzzleGrad)"/>
        <circle cx="205" cy="284" r="14" fill="url(#muzzleGrad)"/>
        <circle cx="228" cy="280" r="13" fill="url(#muzzleGrad)"/>
        <!-- open grin + tongue -->
        <path class="grin" d="M176 254 Q205 290 234 254 Q228 277 205 279 Q182 277 176 254 Z" fill="#7c4438"/>
        <g class="tongue">
          <path d="M192 268 L218 268 L216 296 Q205 306 194 296 Z" fill="#f28bab"/>
          <path d="M205 272 L205 296" stroke="#dd7291" stroke-width="2" stroke-linecap="round"/>
        </g>
        <!-- nose: big and glossy -->
        <ellipse cx="205" cy="226" rx="20" ry="14.5" fill="#7c4b3a"/>
        <ellipse cx="205" cy="230" rx="20" ry="11" fill="#96604a"/>
        <ellipse cx="197" cy="220" rx="7.5" ry="4" fill="#d9a184" opacity=".95" transform="rotate(-18 197 220)"/>
        <ellipse cx="196" cy="229" rx="3.4" ry="6" fill="#59362a"/>
        <ellipse cx="214" cy="229" rx="3.4" ry="6" fill="#59362a"/>
        <path d="M205 239 L205 248" stroke="#b99b78" stroke-width="2.5" stroke-linecap="round"/>
        <!-- closed smile -->
        <path class="smile" d="M186 252 Q196 261 205 254 Q214 261 224 252" fill="none" stroke="#a97e5f" stroke-width="3" stroke-linecap="round"/>
      </g>
      </g>
    </svg>
  </div>
  <p class="hint">Click his left or right side and watch that booty shift. Boop the nose at your own risk.</p>
  <footer>Teddy Wags — Kate's idea 💡 · Built for Ted, the best boy</footer>

<script>
(function(){
  var stage = document.getElementById('stage');
  var counter = document.getElementById('counter');
  var status = document.getElementById('status');
  var rear = document.getElementById('rear');
  var mid = document.getElementById('mid');
  var chest = document.getElementById('chest');
  var headSway = document.getElementById('headSway');
  var tail = document.getElementById('tail');

  var msgs = {
    left:  ['Booty shifted left!', 'That back end slid left.', 'Left with the whole rear end!', 'Wiggle-butt, stage left.'],
    right: ['Booty shifted right!', 'That back end slid right.', 'Right with the whole rear end!', 'Wiggle-butt, stage right.'],
    boop:  ['Boop! The whole back end went off.', 'Nose booped. Booty: activated.', 'Boop! Maximum wiggle.']
  };
  var wags = 0;
  var TAU = Math.PI * 2;
  // Continuous simulation: the phase never resets and everything eases
  // toward its target, so switching sides mid-wiggle glides. The rear end
  // SHIFTS side to side ACROSS CENTER (only a whisper of bias toward the
  // clicked side) while the front stays planted.
  // targetSide: +1 = clicked left, -1 = clicked right.
  var phase = 0, amp = 0, lean = 0;
  var targetSide = -1, excitedUntil = 0, lastFrame = 0, loopRunning = false;

  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  function frame(now){
    var dt = Math.min(64, now - (lastFrame || now));
    lastFrame = now;
    var excited = now < excitedUntil;
    var ampTarget = excited ? 1 : 0;
    var tau = ampTarget > amp ? 90 : 480;
    amp += (ampTarget - amp) * (1 - Math.exp(-dt / tau));
    if(!excited && amp < 0.003) amp = 0;
    lean += (targetSide - lean) * (1 - Math.exp(-dt / 170));
    phase += dt * TAU / 440;

    var dx = amp * (-lean * 2.5 + 14.5 * Math.sin(phase));
    var dy = amp * 1.8 * Math.sin(phase + 0.6);
    var rearRot = amp * 3 * Math.sin(phase + 0.35);
    rear.setAttribute('transform',
      'translate(' + dx.toFixed(2) + ' ' + dy.toFixed(2) + ') rotate(' + rearRot.toFixed(2) + ' 330 320)');
    // waist patch slides at half rate — the spine bends, it doesn't hinge
    mid.setAttribute('transform', 'translate(' + (dx * 0.5).toFixed(2) + ' 0)');
    // docked pom wags on top of the moving rump
    var tailAngle = 6 + amp * (-10 + 17 * Math.sin(2 * phase - 0.9));
    tail.setAttribute('transform', 'rotate(' + tailAngle.toFixed(2) + ' 495 218)');
    // chest shimmy: tiny, opposite, lagged — front stays planted
    var chestAngle = -amp * 1.8 * Math.sin(phase - 0.7);
    chest.setAttribute('transform', chestAngle ? 'rotate(' + chestAngle.toFixed(2) + ' 296 320)' : '');
    // head follows last, barely
    var headAngle = amp * 1.1 * Math.sin(phase - 1.2);
    headSway.setAttribute('transform', headAngle ? 'rotate(' + headAngle.toFixed(2) + ' 205 235)' : '');

    if(amp > 0.12 || excited){
      if(!stage.classList.contains('happy')){
        stage.classList.add('happy', targetSide > 0 ? 'happy-tilt-l' : 'happy-tilt-r');
      }
    } else {
      stage.classList.remove('happy','happy-tilt-l','happy-tilt-r');
    }

    var settled = !excited && amp === 0 && Math.abs(lean - targetSide) < 0.002;
    if(!settled){
      requestAnimationFrame(frame);
    } else {
      loopRunning = false;
      rear.setAttribute('transform', '');
      mid.setAttribute('transform', '');
      chest.setAttribute('transform', '');
      headSway.setAttribute('transform', '');
      tail.setAttribute('transform', 'rotate(6 495 218)');
    }
  }

  function startLoop(){
    if(!loopRunning){ loopRunning = true; lastFrame = 0; requestAnimationFrame(frame); }
  }

  function hearts(x, y, n){
    var rect = stage.getBoundingClientRect();
    for(var i = 0; i < n; i++){
      var el = document.createElement('div');
      el.className = 'heart';
      el.textContent = '💗';
      var spread = 90;
      el.style.left = (x - rect.left + (Math.random() * spread - spread / 2)) + 'px';
      el.style.top = (y - rect.top + (Math.random() * 26 - 13)) + 'px';
      el.style.fontSize = (15 + Math.random() * 15) + 'px';
      el.style.setProperty('--dx', (Math.random() * 70 - 35) + 'px');
      el.style.setProperty('--rot', (Math.random() * 44 - 22) + 'deg');
      el.style.animationDelay = (Math.random() * 0.18) + 's';
      stage.appendChild(el);
      (function(node){ setTimeout(function(){ node.remove(); }, 1600); })(el);
    }
  }

  function doWag(side, x, y, isBoop){
    wags++;
    counter.textContent = 'Wags: ' + wags;
    counter.style.visibility = 'visible';
    status.textContent = isBoop ? pick(msgs.boop) : pick(msgs[side]);
    targetSide = side === 'left' ? 1 : -1;
    excitedUntil = performance.now() + 2100;
    stage.classList.remove('happy-tilt-l','happy-tilt-r');
    stage.classList.add('happy', side === 'left' ? 'happy-tilt-l' : 'happy-tilt-r');
    hearts(x, y, isBoop ? 7 : 5);
    startLoop();
  }

  var lastPointerAt = 0;
  stage.addEventListener('pointerdown', function(ev){
    var nowMs = performance.now();
    if(nowMs - lastPointerAt < 120) return;
    lastPointerAt = nowMs;
    var rect = stage.getBoundingClientRect();
    var x = ev.clientX - rect.left, y = ev.clientY - rect.top;
    var nx = x / rect.width, ny = y / rect.height;
    // his nose, in stage fractions (head front-left in this stance)
    var isBoop = Math.abs(nx - 0.320) < 0.055 && Math.abs(ny - 0.377) < 0.05;
    var side = nx < 0.5 ? 'left' : 'right';
    doWag(side, ev.clientX, ev.clientY, isBoop);
  });

  stage.addEventListener('keydown', function(ev){
    if(ev.key === 'ArrowLeft'){ doWag('left', 0, 0, false); ev.preventDefault(); }
    else if(ev.key === 'ArrowRight'){ doWag('right', 0, 0, false); ev.preventDefault(); }
    else if(ev.key === 'Enter' || ev.key === ' '){
      doWag(Math.random() < 0.5 ? 'left' : 'right', 0, 0, false); ev.preventDefault();
    }
  });
})();
</script>
</body>
</html>
