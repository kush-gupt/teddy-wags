<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teddy Wags — click a side, he wags that side</title>
<meta name="description" content="Teddy the cockapoo wags his tail on whichever side you click. Kate's idea.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:"Baloo 2", ui-rounded, "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
    background:linear-gradient(180deg,#fff6e2 0%,#ffecca 55%,#ffe3ae 100%);
    color:#4a3826;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; overflow-x:hidden;
    user-select:none; -webkit-user-select:none;
  }
  header{ text-align:center; padding:26px 16px 4px; }
  h1{ font-size:clamp(2rem,6vw,3.2rem); font-weight:800; letter-spacing:.5px; color:#5b4028; }
  h1 .paw{ display:inline-block; transform:rotate(-12deg); }
  .sub{ font-size:clamp(1rem,3vw,1.25rem); font-weight:600; color:#8a6a45; margin-top:2px; }
  #status{
    margin-top:14px; min-height:2.2em; font-size:clamp(1.15rem,3.6vw,1.6rem);
    font-weight:800; color:#b45a1b; text-align:center; padding:0 12px;
  }
  #stage{
    position:relative; width:min(92vw,560px); aspect-ratio:640/600;
    cursor:pointer; touch-action:manipulation; outline:none;
    border-radius:28px;
  }
  #stage:focus-visible{ box-shadow:0 0 0 4px #e8a54b; }
  #stage svg.dog{ width:100%; height:100%; display:block; overflow:visible; }
  .hint{
    display:flex; justify-content:space-between; width:min(92vw,560px);
    padding:2px 10px 0; font-weight:700; color:#a07a4e; font-size:clamp(.9rem,2.8vw,1.05rem);
  }
  #counter{
    margin-top:10px; background:#fffdf7; border:3px solid #f0d9ae; color:#7a5a33;
    font-weight:800; font-size:1.05rem; padding:6px 18px; border-radius:999px;
    box-shadow:0 3px 0 #ecd7ab;
  }
  footer{ margin-top:auto; padding:22px 16px 26px; text-align:center; color:#9b7c55; font-weight:600; font-size:.98rem; }
  footer .idea{ color:#b45a1b; font-weight:800; }
  .heart{
    position:absolute; pointer-events:none; z-index:5;
    animation:floatUp 1.15s ease-out forwards;
  }
  @keyframes floatUp{
    0%{ transform:translate(-50%,-50%) scale(.5) rotate(0deg); opacity:0; }
    15%{ opacity:1; }
    100%{ transform:translate(-50%,-190%) scale(1.15) rotate(var(--spin,10deg)); opacity:0; }
  }
  .eye{ transform-box:fill-box; transform-origin:center; animation:blink 4.8s infinite; }
  @keyframes blink{ 0%,91%,100%{ transform:scaleY(1);} 94%{ transform:scaleY(.08);} 97%{ transform:scaleY(1);} }
  #breath{ transform-box:fill-box; transform-origin:50% 100%; animation:breath 3.4s ease-in-out infinite alternate; }
  @keyframes breath{ from{ transform:scale(1,1);} to{ transform:scale(1.012,1.02);} }
  #dogBounce{ transform-box:fill-box; transform-origin:50% 100%; }
  .happy #dogBounce{ animation:bounce .38s ease-in-out 5; }
  @keyframes bounce{ 0%,100%{ transform:translateY(0);} 35%{ transform:translateY(-10px);} 70%{ transform:translateY(1px);} }
  #head{ transform-box:fill-box; transform-origin:50% 88%; transition:transform .18s ease; transform:rotate(2deg); }
  .happy-tilt-l #head{ transform:rotate(-6deg); }
  .happy-tilt-r #head{ transform:rotate(6deg); }
  .mouthClosed{ transition:opacity .15s ease; }
  .happy .mouthClosed{ opacity:0; }
  #openSmile{ opacity:0; transition:opacity .15s ease; }
  .happy #openSmile{ opacity:1; }
  .earL,.earR{ transform-box:fill-box; }
  .earL{ transform-origin:85% 8%; } .earR{ transform-origin:15% 8%; }
  .happy .earL{ animation:earWigL .3s ease-in-out 6 alternate; }
  .happy .earR{ animation:earWigR .3s ease-in-out 6 alternate; }
  @keyframes earWigL{ from{ transform:rotate(0);} to{ transform:rotate(-5deg);} }
  @keyframes earWigR{ from{ transform:rotate(0);} to{ transform:rotate(5deg);} }
</style>
</head>
<body>
<header>
  <h1><span class="paw">🐾</span> Teddy Wags</h1>
  <p class="sub">Click the left side of Teddy, his tail wags over there. Click the right side, it wags over there.</p>
</header>
<div id="status" aria-live="polite">Go on, give Teddy a click.</div>

    <!-- ONE tail: a fluffy plume curled beside his haunch. The wrapper flips it to the clicked side. -->

      </g>
    </g>

    <!-- haunches + back paws -->
    <ellipse cx="208" cy="446" rx="62" ry="76" fill="#f5e3c0"/>
    <ellipse cx="432" cy="446" rx="62" ry="76" fill="#f5e3c0"/>
    <ellipse cx="172" cy="520" rx="45" ry="16" fill="#f7e8cb" transform="rotate(-14 172 520)"/>
    <ellipse cx="468" cy="520" rx="45" ry="16" fill="#f7e8cb" transform="rotate(14 468 520)"/>
    <path d="M158 510 l6 9 M176 508 l4 10" stroke="#dfc493" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M464 508 l-4 10 M482 510 l-6 9" stroke="#dfc493" stroke-width="3.5" stroke-linecap="round"/>

    <!-- torso -->
    <path d="M320 262 C252 262 226 338 228 418 C230 484 268 522 320 522 C372 522 410 484 412 418 C414 338 388 262 320 262 Z" fill="#f5e3c0"/>
    <!-- fluffy white chest bib -->
    <path d="M320 356 C282 356 263 394 267 434 C270 469 293 494 320 494 C347 494 370 469 373 434 C377 394 358 356 320 356 Z" fill="#fffaf0" opacity="0.9"/>
    <path d="M262 380 q-8 30 -2 58 M378 380 q8 30 2 58" stroke="#e9d5ab" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- neck shadow -->
    <ellipse cx="320" cy="278" rx="86" ry="17" fill="#dfc28c" opacity="0.45"/>

    <!-- blue houndstooth bandana -->
    <path d="M238 288 Q320 332 402 288 L388 322 Q320 442 320 442 Q320 442 252 322 Z" fill="url(#hound)"/>
    <path d="M238 288 Q320 332 402 288 L388 322 Q320 442 320 442 Q320 442 252 322 Z" fill="none" stroke="#2f4c7c" stroke-width="5" stroke-linejoin="round"/>
    <g transform="rotate(16 382 318)">
      <rect x="366" y="300" width="33" height="38" rx="9" fill="#41619b" stroke="#2f4c7c" stroke-width="4"/>
      <path d="M374 338 l-4 32 M392 338 l6 30" stroke="#41619b" stroke-width="11" stroke-linecap="round"/>
    </g>

    <!-- front legs + paws -->
    <path d="M283 402 v96" stroke="#f9edd4" stroke-width="36" stroke-linecap="round"/>
    <path d="M357 402 v96" stroke="#f9edd4" stroke-width="36" stroke-linecap="round"/>
    <ellipse cx="283" cy="514" rx="30" ry="14" fill="#fdf6e7"/>
    <ellipse cx="357" cy="514" rx="30" ry="14" fill="#fdf6e7"/>
    <path d="M273 505 v10 M293 505 v10" stroke="#dfc493" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M347 505 v10 M367 505 v10" stroke="#dfc493" stroke-width="3.5" stroke-linecap="round"/>

  </g>

    <!-- head -->
    <g id="head">
      <!-- ears: one drawn, one mirrored for symmetry -->
      <g class="earL">
        <path d="M248 94 C206 98 187 138 189 195 C190 240 197 284 212 298 C228 312 242 288 245 238 C248 196 260 148 264 120 C266 102 262 92 248 94 Z" fill="#ecd7ab"/>
        <path d="M233 118 C215 132 207 170 210 212 C212 242 217 260 223 266 C231 248 235 212 236 174 C237 146 237 126 233 118 Z" fill="#f9edd4" opacity="0.8"/>
        <path d="M222 128 C206 148 201 190 205 236 C207 262 212 278 218 284" stroke="#dec188" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.85"/>
        <path d="M196 250 q8 10 20 12 M200 272 q8 8 18 9" stroke="#dec188" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7"/>
      </g>
      <g transform="translate(640 0) scale(-1 1)">
        <g class="earR">
          <path d="M248 94 C206 98 187 138 189 195 C190 240 197 284 212 298 C228 312 242 288 245 238 C248 196 260 148 264 120 C266 102 262 92 248 94 Z" fill="#ecd7ab"/>
          <path d="M233 118 C215 132 207 170 210 212 C212 242 217 260 223 266 C231 248 235 212 236 174 C237 146 237 126 233 118 Z" fill="#f9edd4" opacity="0.8"/>
          <path d="M222 128 C206 148 201 190 205 236 C207 262 212 278 218 284" stroke="#dec188" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.85"/>
          <path d="M196 250 q8 10 20 12 M200 272 q8 8 18 9" stroke="#dec188" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7"/>
        </g>
      </g>
      <!-- skull -->
      <path d="M320 62 C384 62 420 108 418 168 C416 214 396 246 366 260 L274 260 C244 246 224 214 222 168 C220 108 256 62 320 62 Z" fill="#f5e3c0"/>
      <!-- top tuft -->
      <circle cx="282" cy="70" r="20" fill="#f5e3c0"/>
      <circle cx="320" cy="58" r="24" fill="#f5e3c0"/>
      <circle cx="358" cy="70" r="20" fill="#f5e3c0"/>
      <ellipse cx="320" cy="106" rx="56" ry="30" fill="#fdf3dd" opacity="0.85"/>
      <!-- cheek fluff -->
      <circle cx="240" cy="228" r="20" fill="#f5e3c0"/>
      <circle cx="400" cy="228" r="20" fill="#f5e3c0"/>

      <ellipse cx="397" cy="205" rx="16" ry="9" fill="#f0b98a" opacity="0.35"/>
      <!-- brow tufts -->
      <ellipse cx="272" cy="126" rx="21" ry="10" fill="#fff6e3" opacity="0.95" transform="rotate(-8 272 126)"/>
      <ellipse cx="368" cy="126" rx="21" ry="10" fill="#fff6e3" opacity="0.95" transform="rotate(8 368 126)"/>
      <!-- muzzle + mustache + beard -->
      <ellipse cx="320" cy="218" rx="58" ry="43" fill="#fffaf0"/>
      <ellipse cx="287" cy="224" rx="23" ry="14" fill="#fffaf0" transform="rotate(-14 287 224)"/>
      <ellipse cx="353" cy="224" rx="23" ry="14" fill="#fffaf0" transform="rotate(14 353 224)"/>
      <circle cx="291" cy="250" r="15" fill="#fffaf0"/>
      <circle cx="320" cy="258" r="17" fill="#fffaf0"/>
      <circle cx="349" cy="250" r="15" fill="#fffaf0"/>
      <!-- eyes -->
      <g class="eye">
        <circle cx="272" cy="150" r="14" fill="#38271c"/>
        <circle cx="267" cy="144" r="5" fill="#ffffff"/>
        <circle cx="277" cy="155" r="2.4" fill="#ffffff" opacity="0.9"/>
      </g>
      <g class="eye">
        <circle cx="368" cy="150" r="14" fill="#38271c"/>
        <circle cx="363" cy="144" r="5" fill="#ffffff"/>
        <circle cx="373" cy="155" r="2.4" fill="#ffffff" opacity="0.9"/>
      </g>
      <path d="M254 138 Q272 129 290 138 M350 138 Q368 129 386 138" stroke="#e0c48f" stroke-width="5" stroke-linecap="round" fill="none"/>
      <!-- nose (click it for a boop) -->
      <g id="nose">
        <ellipse cx="320" cy="194" rx="20" ry="14.5" fill="#62422e"/>
        <ellipse cx="312" cy="187" rx="7" ry="4.2" fill="#ffffff" opacity="0.55"/>
        <circle cx="331" cy="190" r="2" fill="#ffffff" opacity="0.35"/>
        <circle cx="314" cy="198" r="2.4" fill="#452c1c"/>
        <circle cx="326" cy="198" r="2.4" fill="#452c1c"/>

      <!-- mouth: closed smile at rest, big open grin when happy -->
      <path class="mouthClosed" d="M320 208 v7 M320 215 q-10 10 -22 5 M320 215 q10 10 22 5" stroke="#8a6a4d" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    </g>
  </g>
  </g>
</svg>
</div>

<div class="hint"><span>← wag left</span><span>wag right →</span></div>
<div id="counter">Wags: 0</div>

<footer>
  <p><span class="idea">Kate's idea.</span> Built for Teddy, a very good cockapoo with one very waggy tail.</p>
</footer>

<script>
(function(){
  var stage = document.getElementById('stage');
  var tailFlip = document.getElementById('tailFlip');
  var tail = document.getElementById('tail');
  var booty = document.getElementById('booty');
  var status = document.getElementById('status');
  var counter = document.getElementById('counter');
  var wags = 0;
  var wag = null;
  var DURATION = 2000;
  var REST = 6;

  var msgs = {
    left:  ["Booty swings left!", "Teddy wags left!", "Full wiggle, left side!", "That booty is swinging left."],
    right: ["Booty swings right!", "Teddy wags right!", "Full wiggle, right side!", "That booty is swinging right."],
    boop:  ["Boop! Right on the nose.", "Boop achieved. Teddy approves.", "A perfect boop."]
  };
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

  function setTail(angle){
    tail.setAttribute('transform', 'rotate(' + angle.toFixed(2) + ' 418 470)');
  }

  function frame(now){
    if(!wag) return;
    var t = (now - wag.start) / DURATION;
    if(t >= 1){
      setTail(REST);
      booty.setAttribute('transform', '');
      stage.classList.remove('happy','happy-tilt-l','happy-tilt-r');
      wag = null; return;
    }
    var env = Math.pow(1 - t, 0.55) * Math.min(1, t / 0.08 + 0.25);
    var angle = REST - 16 * env + Math.sin((now - wag.start) / 52) * 24 * env;
    setTail(angle);
    // the dramatic booty swing: whole rear end sways around the shoulders,
    // biased hard toward the clicked side
    var sign = wag.side === 'left' ? 1 : -1;
    var bAngle = sign * env * (7 + 8.5 * Math.sin((now - wag.start) / 95));
    booty.setAttribute('transform', 'rotate(' + bAngle.toFixed(2) + ' 320 300)');
    requestAnimationFrame(frame);
  }

  function hearts(x, y, n){
    for(var i = 0; i < n; i++){
      var s = document.createElementNS('http://www.w3.org/2000/svg','svg');
      s.setAttribute('viewBox','0 0 24 24');
      s.innerHTML = '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#ef7d9b"/>';
      s.classList.add('heart');
      var size = 16 + Math.random() * 16;
      s.style.width = size + 'px'; s.style.height = size + 'px';
      s.style.left = (x + (Math.random() * 90 - 45)) + 'px';
      s.style.top = (y + (Math.random() * 30 - 15)) + 'px';
      s.style.setProperty('--spin', (Math.random() * 36 - 18) + 'deg');
      stage.appendChild(s);
      (function(el){ setTimeout(function(){ el.remove(); }, 1250); })(s);
    }
  }

  function doWag(side, x, y, isBoop){
    wags++;
    counter.textContent = 'Wags: ' + wags;
    status.textContent = isBoop ? pick(msgs.boop) : pick(msgs[side]);
    tailFlip.setAttribute('transform', side === 'left' ? 'translate(640 0) scale(-1 1)' : '');
    wag = { side: side, start: performance.now() };
    stage.classList.remove('happy-tilt-l','happy-tilt-r');
    void stage.offsetWidth;
    stage.classList.add('happy', side === 'left' ? 'happy-tilt-l' : 'happy-tilt-r');
    hearts(x, y, isBoop ? 7 : 5);
    requestAnimationFrame(frame);
  }

  var lastPointerAt = 0;
  stage.addEventListener('pointerdown', function(e){
    var nowMs = performance.now();
    if(nowMs - lastPointerAt < 120) return;
    lastPointerAt = nowMs;
    var r = stage.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    var tg = e.target;
    var isBoop = tg && tg.closest && !!tg.closest('#nose');
    var side = x < r.width / 2 ? 'left' : 'right';
    doWag(side, x, y, isBoop);
  });

  stage.addEventListener('keydown', function(e){
    var r = stage.getBoundingClientRect();
    if(e.key === 'ArrowLeft'){ e.preventDefault(); doWag('left', r.width * 0.3, r.height * 0.4, false); }
    if(e.key === 'ArrowRight'){ e.preventDefault(); doWag('right', r.width * 0.7, r.height * 0.4, false); }
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); doWag(Math.random() < 0.5 ? 'left' : 'right', r.width / 2, r.height * 0.4, false); }
  });
})();
</script>
</body>
</html>
