<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teddy Wags — click a side, watch the booty shift</title>
<meta name="description" content="Teddy the cockapoo wiggles his whole rear end toward whichever side you click. Kate's idea.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:'Baloo 2', ui-rounded, system-ui, sans-serif;
    background:linear-gradient(180deg, #fdf3e0 0%, #fbe8cd 55%, #f7ddba 100%);
    color:#5b4632;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:24px 12px 16px;
    -webkit-tap-highlight-color:transparent;
  }
  h1 { font-size:clamp(30px, 6vw, 46px); font-weight:800; letter-spacing:.5px; color:#7a4b21; }
  h1 .paw { color:#d98a3d; }
  #status { font-size:clamp(17px, 3.4vw, 22px); font-weight:700; color:#96682f; min-height:1.5em; margin-top:2px; text-align:center; }
  #counter {
    margin-top:8px; background:#fffdf7; border:2px solid #e8c98f; color:#96682f;
    font-weight:800; font-size:16px; padding:4px 16px; border-radius:999px;
    box-shadow:0 2px 0 #e8c98f; visibility:hidden;
  }
  #stage {
    position:relative; width:min(92vw, 560px); margin-top:6px;
    cursor:pointer; touch-action:manipulation; user-select:none; -webkit-user-select:none;
    outline:none;
  }
  #stage:focus-visible { filter:drop-shadow(0 0 10px rgba(217,138,61,.55)); border-radius:24px; }
  svg.dog { width:100%; height:auto; display:block; overflow:visible; }

  #breath { transform-box:fill-box; transform-origin:50% 60%; animation:breathe 3.6s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform:scale(1,1); } 50% { transform:scale(1.012,1.02); } }

  .eye { transform-box:fill-box; transform-origin:center; animation:blink 4.6s infinite; }
  @keyframes blink { 0%, 92%, 100% { transform:scaleY(1); } 95% { transform:scaleY(.08); } }

  #head { transform-box:fill-box; transform-origin:50% 88%; transform:rotate(0deg); transition:transform .25s ease; }
  .happy-tilt-l #head{ transform:rotate(-4deg); }
  .happy-tilt-r #head{ transform:rotate(4deg); }

  .earL, .earR { transform-box:fill-box; }
  .earL { transform-origin:70% 6%; }
  .earR { transform-origin:30% 6%; }
  .happy .earL { animation:earWiggleL .46s ease-in-out infinite; }
  .happy .earR { animation:earWiggleR .46s ease-in-out infinite .08s; }
  @keyframes earWiggleL { 0%,100% { transform:rotate(0deg); } 50% { transform:rotate(-6deg); } }
  @keyframes earWiggleR { 0%,100% { transform:rotate(0deg); } 50% { transform:rotate(6deg); } }

  .grin, .tongue { opacity:0; transition:opacity .18s ease; }
  .happy .grin, .happy .tongue { opacity:1; }
  .happy .smile { opacity:0; }
  .smile { transition:opacity .18s ease; }
  .happy .eye { animation:none; transform:scale(1.18); }
  .brow { opacity:0; transition:opacity .18s ease; }
  .happy .brow { opacity:1; }

  .heart { position:absolute; pointer-events:none; animation:floatUp 1.15s ease-out forwards; z-index:5; line-height:1; }
  @keyframes floatUp {
    0% { transform:translate(-50%,-50%) scale(.5) rotate(0deg); opacity:0; }
    15% { opacity:1; }
    100% { transform:translate(calc(-50% + var(--dx)), calc(-50% - 120px)) scale(1.15) rotate(var(--rot)); opacity:0; }
  }
  .hint { margin-top:10px; font-size:15px; font-weight:600; color:#b0824a; text-align:center; }
  footer { margin-top:auto; padding-top:14px; font-size:13.5px; color:#bfa07a; font-weight:600; text-align:center; }
</style>
</head>
<body>
  <h1>Teddy Wags <span class="paw">🐾</span></h1>
  <div id="status" aria-live="polite">Go on, give Teddy a click.</div>
  <div id="counter">Wags: 0</div>

  <div id="stage" role="button" tabindex="0" aria-label="Teddy the cockapoo. Click the left side to shift his booty left, the right side to shift it right.">
    <svg class="dog" viewBox="0 0 640 600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="bodyGrad" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="0" y2="460">
          <stop offset="0" stop-color="#f8ead0"/>
          <stop offset=".45" stop-color="#f2ddae"/>
          <stop offset=".78" stop-color="#ead09e"/>
          <stop offset="1" stop-color="#dfbe82"/>
        </linearGradient>
        <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fffaf0"/>
          <stop offset=".6" stop-color="#fdf3da"/>
          <stop offset="1" stop-color="#f0dbab"/>
        </linearGradient>
        <linearGradient id="earGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f7e6c2"/>
          <stop offset="1" stop-color="#e6c78f"/>
        </linearGradient>
        <linearGradient id="bibGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fffdf6"/>
          <stop offset="1" stop-color="#f2e3c2"/>
        </linearGradient>
        <linearGradient id="muzzleGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fffefb"/>
          <stop offset="1" stop-color="#f5e9cd"/>
        </linearGradient>
        <radialGradient id="tailGrad" cx=".38" cy=".32" r=".85">
          <stop offset="0" stop-color="#f9ecd2"/>
          <stop offset="1" stop-color="#e7ca92"/>
        </radialGradient>
      </defs>

      <ellipse cx="330" cy="536" rx="238" ry="23" fill="#8a6134" opacity=".14"/>

      <!-- REAR: rump, back legs and tail. It SHIFTS sideways (translation)
           while the front end stays planted — a real wiggle-butt. -->
      <g id="rear">
        <!-- far back leg -->
        <path d="M520 372 L558 372 L556 490 Q556 512 535 512 Q515 512 516 490 Z" fill="#e9d09c"/>
        <ellipse cx="536" cy="516" rx="25" ry="12" fill="#f3e3c0"/>
        <!-- the long back + rump, spanning deep under the chest so no gap opens -->
        <path d="M298 252 C330 232 372 218 420 210 C480 200 540 210 572 244 C606 280 614 336 592 386 C572 430 516 450 448 446 C386 442 330 428 306 396 C290 374 286 286 298 252 Z" fill="url(#bodyGrad)" stroke="rgba(196,158,96,.30)" stroke-width="2"/>
        <!-- rump shading -->
        <path d="M560 258 C596 292 604 340 586 384 C600 336 592 292 560 258 Z" fill="rgba(190,150,88,.28)"/>
        <!-- near back leg with a fluffy skirt over the hip -->
        <path d="M446 400 C442 436 444 470 446 494 Q447 514 468 514 Q488 514 487 494 L486 402 C474 414 458 414 446 400 Z" fill="url(#bodyGrad)"/>
        <ellipse cx="467" cy="518" rx="27" ry="13" fill="#f8ecd4"/>
        <path d="M456 512 v6 M468 514 v6 M480 512 v6" stroke="#dcc08c" stroke-width="2" stroke-linecap="round"/>
        <!-- docked pom tail on top of the rump, like the real Ted -->
        <g id="tail">
          <path d="M538 244 Q546 210 564 198" fill="none" stroke="#ecd7a8" stroke-width="17" stroke-linecap="round"/>
          <g fill="url(#tailGrad)" stroke="rgba(186,146,88,.45)" stroke-width="1.5">
            <circle cx="572" cy="182" r="21"/>
            <circle cx="555" cy="197" r="17"/>
            <circle cx="588" cy="197" r="15"/>
            <circle cx="570" cy="166" r="14"/>
          </g>
        </g>
      </g>

      <!-- MID: a fluff patch over the waist joint that slides at half the
           rear's shift, bending the body like a spine instead of hinging it -->
      <g id="mid">
        <path d="M296 246 C336 230 368 248 374 298 C379 348 372 404 342 434 C320 454 294 440 288 404 C280 352 282 282 296 246 Z" fill="url(#bodyGrad)"/>
      </g>

      <!-- FRONT: planted. Chest breathes and shimmies a touch; legs never move. -->
      <g id="front">
        <g id="breath">
          <g id="chest">
            <path d="M248 292 C232 352 242 412 274 446 C300 473 346 473 370 444 C394 416 396 352 382 306 C368 264 338 246 310 250 C280 254 256 264 248 292 Z" fill="url(#bibGrad)"/>
            <!-- navy plaid bandana, like his birthday one -->
            <path d="M246 290 Q314 330 386 288 L379 322 Q315 358 254 324 Z" fill="#274b73"/>
            <path d="M262 296 L268 330 M300 310 L304 344 M340 308 L342 340 M368 294 L364 326" stroke="rgba(255,255,255,.20)" stroke-width="5"/>
            <path d="M252 308 Q316 344 382 306" stroke="rgba(140,180,225,.35)" stroke-width="5" fill="none"/>
            <!-- little white paw print -->
            <g fill="#ffffff" opacity=".88" transform="rotate(-8 316 322)">
              <ellipse cx="316" cy="328" rx="7" ry="5.5"/>
              <circle cx="306" cy="318" r="3.2"/>
              <circle cx="313" cy="314.5" r="3.2"/>
              <circle cx="320" cy="314.5" r="3.2"/>
              <circle cx="327" cy="318" r="3.2"/>
            </g>
            <path d="M360 320 L394 320 L381 368 Q373 378 365 364 Z" fill="#274b73"/>
            <path d="M368 326 L386 326 M372 344 L382 344" stroke="rgba(255,255,255,.20)" stroke-width="4"/>
            <circle cx="374" cy="312" r="11" fill="#1e3a5a"/>
            <circle cx="374" cy="312" r="4.5" fill="#0f2742"/>
          </g>
        </g>
        <!-- front legs: planted, never move -->
        <path d="M264 416 L300 416 L298 494 Q298 514 281 514 Q264 514 265 494 Z" fill="url(#bibGrad)"/>
        <ellipse cx="281" cy="518" rx="26" ry="12.5" fill="#fbf1dc"/>
        <path d="M270 512 v6 M282 514 v6 M293 512 v6" stroke="#e0c892" stroke-width="2" stroke-linecap="round"/>
        <path d="M322 416 L358 416 L357 494 Q357 514 340 514 Q323 514 324 494 Z" fill="url(#bibGrad)"/>
        <ellipse cx="341" cy="518" rx="26" ry="12.5" fill="#fbf1dc"/>
        <path d="M330 512 v6 M342 514 v6 M353 512 v6" stroke="#e0c892" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- HEAD: front and big like the photos, growing out of the chest -->
      <g id="headSway">
      <g id="head">
        <!-- neck ruff bridging head and chest -->
        <path d="M214 236 C156 236 124 262 127 296 C129 320 150 334 174 328 L181 346 L195 332 L214 350 L233 332 L247 346 L254 328 C278 334 299 320 301 296 C304 262 272 236 214 236 Z" fill="url(#bodyGrad)"/>
        <!-- ears: long, wavy, cocker-style -->
        <g class="earL">
          <path d="M158 104 C116 112 96 164 100 222 C103 268 112 308 136 320 C158 331 178 314 182 280 C187 236 184 176 176 138 C172 116 170 100 158 104 Z" fill="url(#earGrad)"/>
          <path d="M146 128 C124 150 116 196 120 244 C122 272 128 292 140 296 C130 250 132 180 146 128 Z" fill="#fbf0d8" opacity=".8"/>
        </g>
        <g class="earR">
          <path d="M272 108 C308 110 332 150 336 206 C339 254 332 302 314 318 C297 332 277 318 273 284 C268 238 266 168 272 108 Z" fill="url(#earGrad)"/>
          <path d="M292 132 C310 156 316 204 312 250 C310 278 304 296 294 300 C302 252 300 184 292 132 Z" fill="#fbf0d8" opacity=".8"/>
        </g>
        <!-- skull -->
        <path d="M214 274 C160 274 120 240 117 182 C115 128 132 84 168 64 C182 48 198 44 214 48 C230 44 246 48 260 64 C296 84 313 128 311 182 C308 240 268 274 214 274 Z" fill="url(#headGrad)"/>
        <!-- tuft -->
        <path d="M176 64 C184 38 206 28 214 44 C223 26 246 36 251 60 C237 47 228 52 214 50 C200 52 188 49 176 64 Z" fill="#fffaf0"/>
        <!-- happy brows -->
        <path class="brow" d="M156 138 Q172 128 190 136" fill="none" stroke="#e3c491" stroke-width="5" stroke-linecap="round"/>
        <path class="brow" d="M238 136 Q256 128 272 138" fill="none" stroke="#e3c491" stroke-width="5" stroke-linecap="round"/>
        <!-- eyes -->
        <g class="eye">
          <circle cx="171" cy="166" r="11" fill="#43302a"/>
          <circle cx="175" cy="161" r="3.6" fill="#ffffff"/>
          <circle cx="167" cy="171" r="1.7" fill="#ffffff" opacity=".85"/>
        </g>
        <g class="eye">
          <circle cx="257" cy="166" r="11" fill="#43302a"/>
          <circle cx="261" cy="161" r="3.6" fill="#ffffff"/>
          <circle cx="253" cy="171" r="1.7" fill="#ffffff" opacity=".85"/>
        </g>
        <!-- muzzle + beard -->
        <circle cx="186" cy="234" r="21" fill="url(#muzzleGrad)"/>
        <circle cx="214" cy="242" r="24" fill="url(#muzzleGrad)"/>
        <circle cx="242" cy="234" r="21" fill="url(#muzzleGrad)"/>
        <!-- open grin + tongue -->
        <path class="grin" d="M186 240 Q214 274 242 240 Q236 262 214 264 Q192 262 186 240 Z" fill="#7c4438"/>
        <g class="tongue">
          <path d="M202 256 L226 256 L224 282 Q214 292 204 282 Z" fill="#f28bab"/>
          <path d="M214 260 L214 282" stroke="#dd7291" stroke-width="2" stroke-linecap="round"/>
        </g>
        <!-- nose -->
        <ellipse cx="214" cy="212" rx="18" ry="13" fill="#7c4b3a"/>
        <ellipse cx="214" cy="216" rx="18" ry="10" fill="#96604a"/>
        <ellipse cx="207" cy="207" rx="6.5" ry="3.6" fill="#d9a184" opacity=".9" transform="rotate(-18 207 207)"/>
        <ellipse cx="206" cy="215" rx="3" ry="5.5" fill="#59362a"/>
        <ellipse cx="222" cy="215" rx="3" ry="5.5" fill="#59362a"/>
        <path d="M214 225 L214 234" stroke="#b99b78" stroke-width="2.5" stroke-linecap="round"/>
        <!-- closed smile -->
        <path class="smile" d="M196 238 Q206 246 214 239 Q222 246 232 238" fill="none" stroke="#a97e5f" stroke-width="3" stroke-linecap="round"/>
      </g>
      </g>
    </svg>
  </div>
  <p class="hint">Click his left or right side and watch that booty shift. Boop the nose at your own risk.</p>
  <footer>Teddy Wags — Kate's idea 💡 · Built for Ted, the best boy</footer>

<script>
(function(){
  var stage = document.getElementById('stage');
  var counter = document.getElementById('counter');
  var status = document.getElementById('status');
  var rear = document.getElementById('rear');
  var mid = document.getElementById('mid');
  var chest = document.getElementById('chest');
  var headSway = document.getElementById('headSway');
  var tail = document.getElementById('tail');

  var msgs = {
    left:  ['Booty shifted left!', 'That back end slid left.', 'Left with the whole rear end!', 'Wiggle-butt, stage left.'],
    right: ['Booty shifted right!', 'That back end slid right.', 'Right with the whole rear end!', 'Wiggle-butt, stage right.'],
    boop:  ['Boop! The whole back end went off.', 'Nose booped. Booty: activated.', 'Boop! Maximum wiggle.']
  };
  var wags = 0;
  var TAU = Math.PI * 2;
  // Continuous simulation: the phase never resets and everything eases
  // toward its target, so switching sides mid-wiggle glides. The rear end
  // SHIFTS (translation) while the front stays planted. lean target:
  // +1 = booty biased left, -1 = booty biased right.
  var phase = 0, amp = 0, lean = 0;
  var targetSide = -1, excitedUntil = 0, lastFrame = 0, loopRunning = false;

  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  function frame(now){
    var dt = Math.min(64, now - (lastFrame || now));
    lastFrame = now;
    var excited = now < excitedUntil;
    var ampTarget = excited ? 1 : 0;
    var tau = ampTarget > amp ? 90 : 480;
    amp += (ampTarget - amp) * (1 - Math.exp(-dt / tau));
    if(!excited && amp < 0.003) amp = 0;
    lean += (targetSide - lean) * (1 - Math.exp(-dt / 170));
    phase += dt * TAU / 440;

    var s = Math.sin(phase);
    // the shift: rear end slides sideways, biased toward the clicked side
    var dx = amp * (-lean * 8 + 13 * s);
    var dy = amp * 2 * Math.sin(phase + 0.6);
    var rearRot = amp * 3.4 * Math.sin(phase + 0.35);
    rear.setAttribute('transform',
      'translate(' + dx.toFixed(2) + ' ' + dy.toFixed(2) + ') rotate(' + rearRot.toFixed(2) + ' 340 330)');
    // waist patch slides at half rate — the spine bends, it doesn't hinge
    mid.setAttribute('transform', 'translate(' + (dx * 0.5).toFixed(2) + ' 0)');
    // docked pom wags on top of the moving rump
    var tailAngle = 8 + amp * (-10 + 17 * Math.sin(2 * phase - 0.9));
    tail.setAttribute('transform', 'rotate(' + tailAngle.toFixed(2) + ' 548 232)');
    // chest shimmy: tiny, opposite, lagged — front stays planted
    var chestAngle = -amp * 1.8 * Math.sin(phase - 0.7);
    chest.setAttribute('transform', chestAngle ? 'rotate(' + chestAngle.toFixed(2) + ' 310 320)' : '');
    // head follows last, barely
    var headAngle = amp * 1.1 * Math.sin(phase - 1.2);
    headSway.setAttribute('transform', headAngle ? 'rotate(' + headAngle.toFixed(2) + ' 214 240)' : '');

    if(amp > 0.12 || excited){
      if(!stage.classList.contains('happy')){
        stage.classList.add('happy', targetSide > 0 ? 'happy-tilt-l' : 'happy-tilt-r');
      }
    } else {
      stage.classList.remove('happy','happy-tilt-l','happy-tilt-r');
    }

    var settled = !excited && amp === 0 && Math.abs(lean - targetSide) < 0.002;
    if(!settled){
      requestAnimationFrame(frame);
    } else {
      loopRunning = false;
      rear.setAttribute('transform', '');
      mid.setAttribute('transform', '');
      chest.setAttribute('transform', '');
      headSway.setAttribute('transform', '');
      tail.setAttribute('transform', 'rotate(8 548 232)');
    }
  }

  function startLoop(){
    if(!loopRunning){ loopRunning = true; lastFrame = 0; requestAnimationFrame(frame); }
  }

  function hearts(x, y, n){
    var rect = stage.getBoundingClientRect();
    for(var i = 0; i < n; i++){
      var el = document.createElement('div');
      el.className = 'heart';
      el.textContent = '💗';
      var spread = 90;
      el.style.left = (x - rect.left + (Math.random() * spread - spread / 2)) + 'px';
      el.style.top = (y - rect.top + (Math.random() * 26 - 13)) + 'px';
      el.style.fontSize = (15 + Math.random() * 15) + 'px';
      el.style.setProperty('--dx', (Math.random() * 70 - 35) + 'px');
      el.style.setProperty('--rot', (Math.random() * 44 - 22) + 'deg');
      el.style.animationDelay = (Math.random() * 0.18) + 's';
      stage.appendChild(el);
      (function(node){ setTimeout(function(){ node.remove(); }, 1600); })(el);
    }
  }

  function doWag(side, x, y, isBoop){
    wags++;
    counter.textContent = 'Wags: ' + wags;
    counter.style.visibility = 'visible';
    status.textContent = isBoop ? pick(msgs.boop) : pick(msgs[side]);
    targetSide = side === 'left' ? 1 : -1;
    excitedUntil = performance.now() + 2100;
    stage.classList.remove('happy-tilt-l','happy-tilt-r');
    stage.classList.add('happy', side === 'left' ? 'happy-tilt-l' : 'happy-tilt-r');
    hearts(x, y, isBoop ? 7 : 5);
    startLoop();
  }

  var lastPointerAt = 0;
  stage.addEventListener('pointerdown', function(ev){
    var nowMs = performance.now();
    if(nowMs - lastPointerAt < 120) return;
    lastPointerAt = nowMs;
    var rect = stage.getBoundingClientRect();
    var x = ev.clientX - rect.left, y = ev.clientY - rect.top;
    var nx = x / rect.width, ny = y / rect.height;
    // his nose, in stage fractions (head front-left in this stance)
    var isBoop = Math.abs(nx - 0.334) < 0.055 && Math.abs(ny - 0.353) < 0.05;
    var side = nx < 0.5 ? 'left' : 'right';
    doWag(side, ev.clientX, ev.clientY, isBoop);
  });

  stage.addEventListener('keydown', function(ev){
    if(ev.key === 'ArrowLeft'){ doWag('left', 0, 0, false); ev.preventDefault(); }
    else if(ev.key === 'ArrowRight'){ doWag('right', 0, 0, false); ev.preventDefault(); }
    else if(ev.key === 'Enter' || ev.key === ' '){
      doWag(Math.random() < 0.5 ? 'left' : 'right', 0, 0, false); ev.preventDefault();
    }
  });
})();
</script>
</body>
</html>
